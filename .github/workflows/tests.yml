name: Test Suite

on:
  push:
    branches: [main, actividad4]

  pull_request:
    branches: [main, actividad4]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Descargar el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # Configurar la versión de Node utilizada en el pipeline
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Instalar las dependencias del proyecto
      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      # Ejecutar todas las pruebas y genera el reporte de cobertura
      - name: Ejecutar pruebas con cobertura
        run: npx jest --coverage --ci --runInBand

      # Guardar el reporte de cobertura generado por Jest
      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/